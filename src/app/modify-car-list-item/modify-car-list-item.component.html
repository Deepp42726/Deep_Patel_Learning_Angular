<form [formGroup]="carForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" required />
  </div>

  <div class="form-group">
    <label for="modelYear">Model Year</label>
    <input type="text" id="modelYear" formControlName="modelYear" required />
  </div>

  <div class="form-group">
    <label for="makingYear">Making Year</label>
    <input type="text" id="makingYear" formControlName="makingYear" required />
  </div>

  <div class="form-group">
    <label for="color">Color</label>
    <input type="text" id="color" formControlName="color" required />
  </div>

  <div class="form-group">
    <label for="companyName">Company Name</label>
    <input type="text" id="companyName" formControlName="companyName" required />
  </div>

  <div class="form-group">
    <label for="imgPath">Image Path</label>
    <input type="text" id="imgPath" formControlName="imgPath" required />
  </div>

  <div class="form-group">
    <label for="isElectric">Is Electric</label>
    <input type="checkbox" id="isElectric" formControlName="isElectric" />
  </div>

  <button type="submit">Submit</button>
</form>
