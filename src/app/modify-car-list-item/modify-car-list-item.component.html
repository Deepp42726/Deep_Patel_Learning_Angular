<form [formGroup]="carForm">
  <label for="id">ID:</label>
  <input id="id" formControlName="id" type="number" required>

  <label for="make">Make:</label>
  <input id="make" formControlName="make" required>

  <label for="model">Model:</label>
  <input id="model" formControlName="model" required>

  <label for="year">Year:</label>
  <input id="year" formControlName="year" type="number" required>

  <label for="color">Color:</label>
  <input id="color" formControlName="color">

  <button type="button" (click)="addCar()">Add Item</button>
  <button type="button" (click)="updateCar()">Update Item</button>
</form>
