<div class="container">
  <h2>Car List</h2>


  <ul>
    <li *ngFor="let car of carList; odd as isOdd; even as isEven">
      <app-car-list-item [car]="car" [isOdd]="isOdd"></app-car-list-item>
      <button (click)="editCar(car)">Edit</button>
      <button (click)="deleteCar(car.id)">Delete</button>
    </li>
  </ul>


  <div class="container">
    <h2>Car List</h2>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Model Name</th>
        <th>Year</th>
        <th>color</th>
        <th>Is electric</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let car of carList">
        <td>{{ car.id }}</td>
        <td>{{ car | fullCarName }}</td>
        <td>{{ car.makingYear }}</td>
        <td>{{ car.price | currency: 'CAD': 'symbol-narrow' }}</td>
        <td>
          <button (click)="editCar(car)">Edit</button>
          <button (click)="deleteCar(car.id)">Delete</button>
        </td>
      </tr>
      </tbody>
    </table>

    <div *ngIf="error" class="error">{{ error }}</div>
  </div>


</div>
