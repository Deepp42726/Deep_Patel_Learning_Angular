<p>car-list-item works!</p>

<div [ngClass]="{'even-item': !isOdd, 'odd-item': isOdd}">
  <h2>{{car.id}}</h2>
  <p>Release Year: {{ car.makingYear }}</p>
  <p>Color: {{ car.color }}</p>
  <p>Price: {{ car.price | currency: 'CAD': 'symbol-narrow' }}</p>
  <p>Is Electric?: {{ car.isElectric ? 'Yes' : 'No' }}</p>
</div>
